<!DOCTYPE html>
<html>
<head>
    <title>Product Information</title>
    <style>
        table{
            width:100%;
        }
        table,th,td{
            border-collapse: collapse;
            border:1px solid black;
            padding: 8px;
            text-align: left;
        }
        th{
            background-color: gray;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Product Catalog</h2>

    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>In Stock</th>
        </tr>

        <tr>
            <td>T-shirt</td>
            <td>$10</td>
            <td>20</td>
            <td>Yes</td>
        </tr>

        <tr>
            <td>Jeans</td>
            <td>$25</td>
            <td>15</td>
            <td>Yes</td>
        </tr>

        <tr>
            <td>Shoes</td>
            <td>$40</td>
            <td>0</td>
            <td>No</td>
        </tr>

    </table>

</body>
</html>
